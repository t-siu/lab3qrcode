<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <title>QR Code Component</title>


</head>

<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 bg-primary-subtle">

  <div class="qrcode card border-0 shadow-sm p-3 text-center rounded-4" style="max-width: 320px;">
    <div class="image">
      <img src="./images/image-qr-code.png" alt="QR code image" class="img-fluid rounded-3">
    </div>

    <div class="main card-body px-2 pt-3 pb-2">
      <h1 class="h4 fw-bold mb-3">
        Improve your front-end skills by building projects
      </h1>

      <p class="text-secondary mb-0" style="font-size: 15px;">Scan the QR code to visit Frontend Mentor and take your
        coding skills to the next level</p>
    </div>
  </div>

  <footer class="attribution mt-3 text-center medium">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Thai Siu</a>.
  </footer>
</body>

</html>
